<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>策略警示主頁</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --ink:#2b2620;
  --ink-dim:#6b6255;
  --ink-faint:#a39a8c;
  --paper-deep:#ffffff;
  --paper-panel:#fbf8f2;
  --paper-panel-2:#f3ede0;
  --paper-line:#ddd6c8;
  --seal-red:#b8382f;
  --seal-red-dim:#c8433d22;
  --jade:#237a5f;
  --jade-dim:#2f9e7d22;
  --brass:#a5792a;
  --brass-dim:#c9a24a26;
  --font-display:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',Helvetica,Arial,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',Helvetica,Arial,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background:
    radial-gradient(circle at 15% 0%, #fff8ea 0%, transparent 55%),
    var(--paper-deep);
  color:var(--ink);
  font-family:var(--font-body);
  padding:48px 24px 96px;
  min-height:100vh;
}

.wrap{max-width:1040px; margin:0 auto;}

/* ---------- HERO ---------- */
.hero{
  position:relative;
  padding:40px 40px 32px;
  border:1px solid var(--paper-line);
  border-radius:4px;
  background:linear-gradient(180deg,#fbf8f1 0%, #f3ede0 100%);
  overflow:hidden;
  margin-bottom:28px;
}
.hero::before{
  content:"";
  position:absolute; top:0; right:0; bottom:0; width:180px;
  background:repeating-linear-gradient(90deg, transparent 0 22px, var(--paper-line) 22px 23px);
  opacity:.35;
  pointer-events:none;
}
.eyebrow{
  font-family:var(--font-mono); font-size:12px; letter-spacing:.18em;
  color:var(--brass); text-transform:uppercase; display:flex; align-items:center; gap:10px;
}
.eyebrow::before{content:"卷"; font-family:var(--font-display); font-size:14px;}
h1{font-family:var(--font-display); font-weight:900; font-size:42px; margin:14px 0 8px; letter-spacing:.02em;}
.hero p{color:var(--ink-dim); font-size:14.5px; max-width:60ch; line-height:1.7;}

.stat-row{display:flex; gap:14px; margin-top:26px; flex-wrap:wrap;}
.stat{border:1px solid var(--paper-line); border-radius:3px; padding:12px 18px; min-width:110px; background:#0000000a;}
.stat .num{font-family:var(--font-mono); font-size:24px; font-weight:700;}
.stat .lbl{font-size:11.5px; color:var(--ink-dim); margin-top:2px;}
.stat.buy .num{color:var(--seal-red);}

/* ---------- SECTION LABEL ---------- */
.section-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin:36px 0 14px; padding-bottom:8px; border-bottom:1px solid var(--paper-line);
}
.section-head h2{font-family:var(--font-display); font-size:18px; font-weight:700; letter-spacing:.04em;}
.section-head .count{font-family:var(--font-mono); font-size:12px; color:var(--ink-dim);}

/* ---------- STRATEGY CARD (top level) ---------- */
.strategy{
  border:1px solid var(--paper-line); border-radius:4px;
  background:var(--paper-panel); margin-bottom:18px; overflow:hidden;
}
.strategy-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
  padding:20px 22px; cursor:pointer;
}
.strategy-title-block{display:flex; gap:14px; align-items:flex-start;}
.seal{
  flex:none; width:46px; height:46px; border:2px solid currentColor; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:900; font-size:14px; transform:rotate(-4deg);
}
.seal.active{color:var(--seal-red);}
.seal.draft{color:var(--ink-dim); border-style:dashed;}

.strategy-title h3{font-family:var(--font-display); font-size:20px; font-weight:700;}
.strategy-title .type-lbl{font-family:var(--font-mono); font-size:11px; color:var(--brass); letter-spacing:.06em; margin-top:3px;}
.strategy-title .desc{font-size:13px; color:var(--ink-dim); margin-top:8px; max-width:62ch; line-height:1.6;}

.head-right{display:flex; align-items:center; gap:10px;}
.status-chip{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; padding:4px 10px;
  border-radius:20px; white-space:nowrap; border:1px solid currentColor;
}
.status-chip.active{color:var(--seal-red); background:var(--seal-red-dim);}
.status-chip.draft{color:var(--ink-dim); background:#00000010;}
.chevron{font-family:var(--font-mono); color:var(--ink-dim); font-size:14px; transition:transform .15s;}
.strategy.collapsed .chevron{transform:rotate(-90deg);}
.strategy.collapsed .strategy-body{display:none;}

.strategy-body{border-top:1px solid var(--paper-line); padding:18px 22px 22px; background:var(--paper-panel-2);}

.del-x{font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); background:none; border:none; cursor:pointer; padding:2px 4px;}
.del-x:hover{color:var(--seal-red);}

/* ---------- BRANCH LIST (inside 分點追蹤) ---------- */
.heatmap-section{margin-bottom:20px; padding-bottom:18px; border-bottom:1px solid var(--paper-line);}
.heatmap-header{display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
.heatmap-header h4{font-family:var(--font-display); font-size:15px; font-weight:700;}
.heatmap-sub{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim);}
.tm-canvas{position:relative; width:100%; aspect-ratio:1000/380; border-radius:4px; overflow:hidden; background:var(--paper-deep);}
.heatmap-weight-note{font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); margin-top:8px; line-height:1.5;}
.tm-tile{
  position:absolute; box-sizing:border-box; border:1px solid var(--paper-deep);
  padding:5px 7px; overflow:hidden; color:var(--ink); font-family:var(--font-mono);
  display:flex; flex-direction:column; justify-content:flex-start; cursor:default;
  transition:filter .12s;
}
.tm-tile:hover{filter:brightness(1.15); z-index:2;}
.tm-tile-mini{justify-content:center; align-items:center; text-align:center; padding:2px 4px;}
.tm-rank{font-size:.75em; color:var(--ink-faint); line-height:1.15;}
.tm-name{font-family:var(--font-body); font-weight:700; font-size:1.05em; line-height:1.2; white-space:normal; overflow-wrap:anywhere; word-break:break-word;}
.tm-amt{font-size:.85em; font-weight:700; margin-top:1px; white-space:normal; overflow-wrap:anywhere;}
.tm-groups{font-size:.7em; color:var(--ink-dim); margin-top:2px; line-height:1.3; white-space:normal; overflow-wrap:anywhere;}
.tm-tile-mini .tm-name{font-size:1em;}
.tm-tile-mini .tm-amt{font-size:.85em;}

.branch-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.branch-toolbar .lbl{font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); letter-spacing:.08em; text-transform:uppercase;}
.add-branch-btn{
  font-family:var(--font-mono); font-size:11px; color:var(--brass); background:none;
  border:1px solid var(--brass-dim); border-radius:3px; padding:5px 11px; cursor:pointer;
}
.add-branch-btn:hover{background:var(--brass-dim);}

.branch{border:1px solid var(--paper-line); border-radius:4px; margin-bottom:10px; background:var(--paper-panel);}
.branch-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 16px; cursor:pointer;
}
.branch-row .name-block{display:flex; align-items:center; gap:10px; min-width:0;}
.branch-row .dot{width:7px; height:7px; border-radius:50%; flex:none;}
.branch-row .dot.has-data{background:var(--seal-red);}
.branch-row .dot.no-data{background:var(--ink-faint);}
.branch-row .bname{font-weight:500; font-size:14px;}
.branch-row .burl{font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:280px;}
.branch-row .bmeta{display:flex; align-items:center; gap:14px; flex:none;}
.branch-row .top-preview{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim);}
.branch-row .top-preview b{color:var(--seal-red); font-weight:700;}
.branch-row .updated{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); white-space:nowrap;}
.branch-chevron{font-family:var(--font-mono); color:var(--ink-dim); font-size:12px; transition:transform .15s;}
.branch.collapsed .branch-chevron{transform:rotate(-90deg);}
.branch.collapsed .branch-detail{display:none;}
.branch-detail{border-top:1px solid var(--paper-line); padding:14px 16px 16px;}

.period-tabs{display:flex; gap:6px; margin-bottom:14px;}
.period-tab{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); background:none;
  border:1px solid var(--paper-line); border-radius:20px; padding:5px 13px; cursor:pointer;
  transition:border-color .15s, color .15s, background .15s;
}
.period-tab:hover{color:var(--ink);}
.period-tab.active{color:var(--brass); border-color:var(--brass); background:var(--brass-dim);}
.period-updated{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); margin-left:auto; align-self:center;}
.period-tabs-row{display:flex; align-items:center;}

.rank-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:640px){.rank-grid{grid-template-columns:1fr;}}
.rank-col h4{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px;}
.rank-col.buy h4{color:var(--seal-red);}
.rank-col.sell h4{color:var(--jade);}
table{width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:12px;}
tr{border-bottom:1px solid var(--paper-line);}
tr:last-child{border-bottom:none;}
td{padding:6px 4px;}
td.rk{color:var(--ink-dim); width:18px;}
td.amt{text-align:right; font-weight:700;}
.rank-col.buy td.amt{color:var(--seal-red);}
.rank-col.sell td.amt{color:var(--jade);}
td.amt.big-amt{box-shadow:inset 0 0 0 1px var(--brass); background:var(--brass-dim); padding-right:8px;}
td.amt.big-amt::after{content:'⬤'; font-size:6px; color:var(--brass); vertical-align:super; margin-left:3px;}
.empty-note{font-size:12.5px; color:var(--ink-dim); padding:6px 0;}

/* ---------- GENERIC (other strategy types) BODY ---------- */
.generic-body{font-size:13px; color:var(--ink-dim); padding:6px 0;}

/* ---------- ETF HOLDINGS MATRIX ---------- */
.etf-toolbar{margin-bottom:12px;}
.etf-toolbar .lbl{font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); letter-spacing:.08em; text-transform:uppercase;}
.etf-block{border:1px solid var(--paper-line); border-radius:4px; margin-bottom:10px; background:var(--paper-panel);}
.etf-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; cursor:pointer;}
.etf-row .ename{font-weight:500; font-size:14px;}
.etf-row .emeta{display:flex; align-items:center; gap:14px; flex:none;}
.etf-row .ecount{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim);}
.etf-row .updated{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); white-space:nowrap;}
.etf-chevron{font-family:var(--font-mono); color:var(--ink-dim); font-size:12px; transition:transform .15s;}
.etf-block.collapsed .etf-chevron{transform:rotate(-90deg);}
.etf-block.collapsed .etf-detail{display:none;}
.etf-detail{border-top:1px solid var(--paper-line); padding:14px 16px 16px;}
.hide-unchanged-toggle{
  display:flex; align-items:center; gap:5px; cursor:pointer;
  font-family:var(--font-mono); font-size:11px; color:var(--ink-dim); white-space:nowrap;
}
.hide-unchanged-toggle input{cursor:pointer;}
.etf-detail.hide-unchanged table.matrix tr[data-changed="false"]{display:none;}
.matrix-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
table.matrix{width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:14.4px; white-space:nowrap;}
table.matrix th{
  text-align:right; padding:6px 10px; color:var(--ink-dim); font-weight:500;
  border-bottom:1px solid var(--paper-line); font-size:13.2px;
}
table.matrix th:first-child, table.matrix td:first-child{text-align:left; position:sticky; left:0; background:var(--paper-panel); padding-left:2px;}
table.matrix th.net, table.matrix td.net{border-left:1px solid var(--paper-line);}
table.matrix td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--paper-line); vertical-align:middle;}
table.matrix tr:last-child td{border-bottom:none;}
table.matrix td.stock-name{font-family:var(--font-body); font-size:15px;}
table.matrix td.stock-name .code{color:var(--ink-faint); font-family:var(--font-mono); font-size:12.6px; margin-right:4px;}
.chg.pos{color:var(--seal-red); font-weight:700;}
.chg.neg{color:var(--jade); font-weight:700;}
.chg.zero{color:var(--ink-faint);}
.chg.tag{font-size:15.6px; font-weight:700; font-family:var(--font-mono); padding:2px 7px; border-radius:8px; margin-left:4px; vertical-align:middle;}
.chg.tag.new{color:var(--brass); background:var(--brass-dim);}
.chg.tag.removed{color:var(--ink-dim); background:#00000010;}
.chg.big-amt{box-shadow:inset 0 0 0 1px var(--brass); background:var(--brass-dim);}
.chg.big-amt .chg-main::after{content:'⬤'; font-size:7.2px; color:var(--brass); vertical-align:super; margin-left:3px;}
.chg-main{font-weight:700; line-height:1.5;}
.chg-sub{font-weight:500; font-size:12.6px; color:var(--ink-dim); line-height:1.4; opacity:.85;}
.chg.pos .chg-sub{color:var(--seal-red); opacity:.7;}
.chg.neg .chg-sub{color:var(--jade); opacity:.7;}

/* ---------- ADD CARD ---------- */
.add-card{
  border:1px dashed var(--paper-line); border-radius:4px; padding:20px; text-align:center;
  color:var(--ink-dim); cursor:pointer; transition:border-color .15s, color .15s; font-size:13.5px;
}
.add-card:hover{border-color:var(--brass); color:var(--brass);}
.add-card .plus{font-family:var(--font-display); font-size:20px; display:block; margin-bottom:4px;}

/* ---------- MODALS ---------- */
.overlay{position:fixed; inset:0; background:#0008; backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
.overlay.show{display:flex;}
.modal{background:var(--paper-panel); border:1px solid var(--paper-line); border-radius:6px; padding:26px; width:100%; max-width:440px;}
.modal h3{font-family:var(--font-display); margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11.5px; color:var(--ink-dim); margin-bottom:5px; font-family:var(--font-mono);}
.field input, .field textarea, .field select{
  width:100%; background:#00000008; border:1px solid var(--paper-line); border-radius:3px;
  color:var(--ink); padding:9px 10px; font-family:var(--font-body); font-size:13.5px;
}
.field textarea{resize:vertical; min-height:56px;}
.modal-actions{display:flex; gap:10px; margin-top:18px; justify-content:flex-end;}
.btn{font-family:var(--font-mono); font-size:12px; padding:8px 16px; border-radius:3px; cursor:pointer; border:1px solid var(--paper-line); background:none; color:var(--ink-dim);}
.btn.primary{border-color:var(--seal-red); color:var(--seal-red);}
.btn.primary:hover{background:var(--seal-red-dim);}
.btn:hover{color:var(--ink);}

.loading{color:var(--ink-dim); font-size:13px; padding:40px; text-align:center; font-family:var(--font-mono);}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="eyebrow">自動化策略監控</div>
    <h1>策略警示主頁</h1>
    <p>集中管理多個台股自動化策略。「分點追蹤」策略下可同時監控多個券商分點，各自獨立顯示買賣超排行；其他策略類型可依需求擴充。</p>
    <div class="stat-row" id="statRow"></div>
  </div>

  <div class="section-head">
    <h2>已建立策略</h2>
    <span class="count" id="strategyCount"></span>
  </div>

  <div id="strategyList"></div>

  <div class="add-card" onclick="openStrategyModal()">
    <span class="plus">＋</span>
    新增一個策略
  </div>

</div>

<!-- Add strategy modal -->
<div class="overlay" id="strategyOverlay">
  <div class="modal">
    <h3>新增策略</h3>
    <div class="field">
      <label>策略名稱</label>
      <input id="s-name" placeholder="例如：分點追蹤 / 均線突破警示">
    </div>
    <div class="field">
      <label>類型</label>
      <select id="s-type">
        <option value="branch-tracking">分點追蹤（可加入多個分點）</option>
        <option value="generic">一般策略（單一設定）</option>
      </select>
    </div>
    <div class="field">
      <label>說明（選填）</label>
      <textarea id="s-desc" placeholder="這個策略要追蹤或警示什麼？"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeStrategyModal()">取消</button>
      <button class="btn primary" onclick="addStrategy()">建立策略</button>
    </div>
  </div>
</div>

<!-- Add branch modal -->
<div class="overlay" id="branchOverlay">
  <div class="modal">
    <h3>新增分點</h3>
    <div class="field">
      <label>分點名稱</label>
      <input id="b-name" placeholder="例如：元大丹鳳">
    </div>
    <div class="field">
      <label>資料來源網址</label>
      <input id="b-url" placeholder="https://www.wantgoo.com/...">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeBranchModal()">取消</button>
      <button class="btn primary" onclick="addBranch()">加入分點</button>
    </div>
  </div>
</div>

let strategies = [];

function load(){
  document.getElementById('strategyList').innerHTML = '<div class="loading">讀取中…</div>';

  strategies = SEED_DATA.map(s => ({
    ...s,
    branches: s.branches ? s.branches.map(b => ({...b})) : undefined,
    etfs: s.etfs ? s.etfs.map(e => ({...e})) : undefined,
  }));

  let stored = null;
  try{
    const raw = localStorage.getItem('strategies_v3');
    stored = raw ? JSON.parse(raw) : null;
  }catch(e){ stored = null; }

  if(stored){
    stored.forEach(storedStrat => {
      const seedStrat = strategies.find(s => s.id === storedStrat.id);
      if(!seedStrat){
        strategies.push(storedStrat);
      } else if(seedStrat.branches && storedStrat.branches){
        storedStrat.branches.forEach(storedBranch => {
          if(!seedStrat.branches.find(b => b.id === storedBranch.id)){
            seedStrat.branches.push(storedBranch);
          }
        });
      }
    });
  }

  render();
}

function save(){
  try{ localStorage.setItem('strategies_v3', JSON.stringify(strategies)); }
  catch(e){ console.error('storage error', e); }
}

function escapeHtml(str){

function bigAmtThresholdYi(period){
  if(period === '20') return 10;
  if(period === '3m' || period === '6m') return 20;
  return 5;
}
function isBigAmt(amtStr, period){
  const n = parseFloat(String(amtStr).replace(/,/g,''));
  if(isNaN(n)) return false;
  return Math.abs(n) >= bigAmtThresholdYi(period) * 10000;
}
function wanToYi(wanStr){
  const n = typeof wanStr === 'number' ? wanStr : parseFloat(String(wanStr).replace(/,/g,''));
  return n / 10000;
}
function fmtBranchYi(yi){
  const sign = yi < 0 ? '-' : '';
  return sign + Math.abs(yi).toFixed(2);
}

const BRANCH_GROUPS = {
  'khgt-8450': 'Frank',
  'fb-9661': 'Frank',
  'yd-9801': 'Frank',
  'kg-9275': '凱多',
  'dyj-lz': '路竹',
  'gp-779z': '忠哥',
  'zf-zl': '中壢',
  'yd-984k': '焦家',
  'tx-9b25': '五權',
};
const GROUP_ORDER = ['Frank','凱多','路竹','忠哥','中壢','焦家','五權'];
const BRANCH_WEIGHTS = {
  'khgt-8450': 1.275,
  'fb-9661': 1.275,
  'yd-9801': 1.275,
  'kg-9275': 1.275,
  'dyj-lz': 1.275,
  'zf-zl': 1.275,
  'gp-779z': 0.5,
  'yd-984k': 0.7,
  'tx-9b25': 0.7,
};
function branchWeight(bid){
  return BRANCH_WEIGHTS[bid] !== undefined ? BRANCH_WEIGHTS[bid] : 1;
}

function squarifyWorstRatio(row, rowSum, side){
  const rowMax = Math.max(...row);
  const rowMin = Math.min(...row);
  const sideSq = side * side;
  const sumSq = rowSum * rowSum;
  return Math.max((sideSq * rowMax) / sumSq, sumSq / (sideSq * rowMin));
}

function squarify(values, x, y, w, h){
  const rects = [];
  let remaining = values.slice();
  let rx = x, ry = y, rw = w, rh = h;
  while(remaining.length){
    const side = Math.min(rw, rh);
    let row = [remaining[0]];
    let rowSum = remaining[0];
    let i = 1;
    while(i < remaining.length){
      const testRow = row.concat([remaining[i]]);
      const testSum = rowSum + remaining[i];
      if(squarifyWorstRatio(testRow, testSum, side) <= squarifyWorstRatio(row, rowSum, side)){
        row = testRow;
        rowSum = testSum;
        i++;
      } else break;
    }
    if(rw >= rh){
      const colWidth = rowSum / rh;
      let cy = ry;
      row.forEach(v => {
        const itemHeight = (v / rowSum) * rh;
        rects.push({value: v, x: rx, y: cy, w: colWidth, h: itemHeight});
        cy += itemHeight;
      });
      rx += colWidth;
      rw -= colWidth;
    } else {
      const rowHeight = rowSum / rw;
      let cx = rx;
      row.forEach(v => {
        const itemWidth = (v / rowSum) * rw;
        rects.push({value: v, x: cx, y: ry, w: itemWidth, h: rowHeight});
        cx += itemWidth;
      });
      ry += rowHeight;
      rh -= rowHeight;
    }
    remaining = remaining.slice(row.length);
  }
  return rects;
}

function fmtYiAmt(wan){
  return fmtBranchYi(wan / 10000) + '億';
}

function isEtfLabel(label){
  const m = String(label).trim().match(/(\S+)$/);
  const code = m ? m[1] : '';
  return code === '0050' || code === '0056' || code.length === 5;
}

function renderGroupHeatmap(branches, period, periodTitle, side){
  side = side || 'buy';
  const sideLabel = side === 'sell' ? '賣超' : '買超';
  const colorRgb = side === 'sell' ? '47,158,125' : '200,67,61';

  const groupData = {};
  GROUP_ORDER.forEach(g => groupData[g] = {});
  (branches || []).forEach(b => {
    const group = BRANCH_GROUPS[b.id];
    const pData = b.periods && b.periods[period];
    if(!group || !pData) return;
    const weight = branchWeight(b.id);
    (pData[side] || []).forEach(row => {
      const label = row[0];
      if(isEtfLabel(label)) return;
      const amt = Math.abs(parseFloat(String(row[1]).replace(/,/g,'')));
      if(isNaN(amt)) return;
      groupData[group][label] = (groupData[group][label] || 0) + amt * weight;
    });
  });

  const stockTotals = {};
  GROUP_ORDER.forEach(g => {
    Object.entries(groupData[g]).forEach(([label, amt]) => {
      stockTotals[label] = (stockTotals[label] || 0) + amt;
    });
  });
  const top10 = Object.keys(stockTotals).sort((a,b) => stockTotals[b] - stockTotals[a]).slice(0, 10);

  if(top10.length === 0) return '';

  const top10Sum = top10.reduce((s, label) => s + stockTotals[label], 0);
  const CANVAS_W = 1000, CANVAS_H = 380;
  const scale = (CANVAS_W * CANVAS_H) / top10Sum;
  const values = top10.map(label => stockTotals[label] * scale);
  const rects = squarify(values, 0, 0, CANVAS_W, CANVAS_H);

  const tiles = top10.map((label, i) => {
    const rect = rects[i];
    const total = stockTotals[label];
    const pct = (total / top10Sum * 100);
    const contributors = GROUP_ORDER
      .filter(g => groupData[g][label])
      .sort((ga, gb) => groupData[gb][label] - groupData[ga][label])
      .map(g => `${g} ${fmtYiAmt(groupData[g][label])}`)
      .join(' ／ ');
    const alpha = Math.min(0.2 + (pct/100) * 2.2, 0.92);
    const areaShare = (rect.w * rect.h) / (CANVAS_W * CANVAS_H);
    const minSidePx = Math.min(rect.w, rect.h);

    let tier, fontScale, body;
    if(areaShare >= 0.07 && minSidePx >= 55){
      tier = 'full';
      fontScale = Math.min(1.3, 0.85 + areaShare * 3);
      body = `
        <div class="tm-rank">#${i+1}</div>
        <div class="tm-name">${escapeHtml(label)}</div>
        <div class="tm-amt">${fmtYiAmt(total)}・${pct.toFixed(1)}%</div>
        <div class="tm-groups">${escapeHtml(contributors)}</div>`;
    } else if(areaShare >= 0.03 && minSidePx >= 35){
      tier = 'mid';
      fontScale = 0.78;
      body = `
        <div class="tm-name">${escapeHtml(label)}</div>
        <div class="tm-amt">${fmtYiAmt(total)}・${pct.toFixed(1)}%</div>`;
    } else {
      tier = 'mini';
      fontScale = 0.62;
      body = `
        <div class="tm-name">${escapeHtml(label)}</div>
        <div class="tm-amt">${pct.toFixed(1)}%</div>`;
    }

    return `
      <div class="tm-tile tm-tile-${tier}" title="${escapeHtml(label)}（${escapeHtml(periodTitle)}累積${sideLabel}）\n${escapeHtml(contributors)}"
        style="left:${(rect.x/CANVAS_W*100).toFixed(3)}%; top:${(rect.y/CANVAS_H*100).toFixed(3)}%; width:${(rect.w/CANVAS_W*100).toFixed(3)}%; height:${(rect.h/CANVAS_H*100).toFixed(3)}%; background:rgba(${colorRgb},${alpha.toFixed(2)}); font-size:${fontScale.toFixed(2)}em;">${body}
      </div>
    `;
  }).join('');

  const weightNote = (branches || [])
    .filter(b => BRANCH_GROUPS[b.id])
    .map(b => `${escapeHtml(b.name)}×${branchWeight(b.id)}`)
    .join('、');

  return `
    <div class="heatmap-section">
      <div class="heatmap-header">
        <h4>分點分群・${sideLabel}熱力圖・${escapeHtml(periodTitle)}</h4>
        <span class="heatmap-sub">${escapeHtml(periodTitle)}累積${sideLabel}前十大標的・面積 = 佔前十大總額比例</span>
      </div>
      <div class="tm-canvas">${tiles}</div>
      <div class="heatmap-weight-note">分點權重：${weightNote}（未列出權重者為 ×1）</div>
    </div>
  `;
}

  if(type === 'branch-tracking') return '分點追蹤 · 多分點監控';
  if(type === 'etf-holdings') return 'ETF持股異動 · 定義檔比對';
  return '一般策略';

function fmtLots(n){
  if(n === null || n === undefined) return '－';
  const sign = n > 0 ? '+' : '';
  return sign + n.toLocaleString('en-US', {minimumFractionDigits: n % 1 === 0 ? 0 : 3, maximumFractionDigits: 3});
}

function fmtYi(n){
  if(n === null || n === undefined) return '－';
  const sign = n > 0 ? '+' : '';
  return sign + n.toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + '億';
}

function fmtRatio(r){
  if(r === 'nan' || r === null || r === undefined) return 'nan';
  const sign = r > 0 ? '+' : '';
  return sign + (r * 100).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%';
}

function renderMatrixCell(change){
  if(!change) return '<td class="chg zero">－</td>';
  const cls = change.delta > 0 ? 'pos' : (change.delta < 0 ? 'neg' : 'zero');
  const big = change.amount_yi !== null && change.amount_yi !== undefined && Math.abs(change.amount_yi) >= 5 ? ' big-amt' : '';
  const tag = change.type === 'new' ? '<span class="chg tag new">新</span>'
            : change.type === 'removed' ? '<span class="chg tag removed">移</span>' : '';
  return `<td class="chg ${cls}${big}">
    <div class="chg-main">${fmtLots(change.delta)}張${tag}</div>
    <div class="chg-sub">${fmtYi(change.amount_yi)}</div>
    <div class="chg-sub">${fmtRatio(change.ratio)}</div>
  </td>`;
}

  const name = document.getElementById('b-name').value.trim();
  const url = document.getElementById('b-url').value.trim();
  if(!name || pendingBranchStrategyIdx === null) return;
  strategies[pendingBranchStrategyIdx].branches.push({
    id: 'branch-' + Date.now(),
    name, url,
    updated: null,
    collapsed: true,
    buy: [], sell: []
  });
  await save();
  closeBranchModal();
  render();
}
async function removeBranch(sIdx, bIdx){
  strategies[sIdx].branches.splice(bIdx,1);
  await save();
  render();
}

function openStrategyModal(){ document.getElementById('strategyOverlay').classList.add('show'); }
function closeStrategyModal(){
  document.getElementById('strategyOverlay').classList.remove('show');
  document.getElementById('s-name').value = '';
  document.getElementById('s-desc').value = '';
}
async function addStrategy(){
  const name = document.getElementById('s-name').value.trim();
  const type = document.getElementById('s-type').value;
  const desc = document.getElementById('s-desc').value.trim();
  if(!name) return;
  const newStrat = {
    id: 'strat-' + Date.now(),
    name, type, desc,
    status: 'draft',
    collapsed: false,
  };
  if(type === 'branch-tracking'){ newStrat.branches = []; }
  strategies.push(newStrat);
  await save();
  closeStrategyModal();
  render();
}
async function removeStrategy(idx){
  strategies.splice(idx,1);
  await save();
  render();
}

load();
</script>
</body>
</html>
